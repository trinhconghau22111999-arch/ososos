<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DK Home – giao diện Android</title>
<style>
:root{--page:#e6e9f2;--ink:#0d1224;--panel:#121a33;--panel2:#1a2347;--line:#2c3a78;--cyan:#00e5ff;--pink:#ff2d8a;--amber:#ffab00;--violet:#7b6cff;--text:#c9d3ff;--dim:#7f8bc0;--blue:#2f6bff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#05070f}}
:root[data-theme="dark"]{--page:#05070f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);font-family:"Rajdhani","Segoe UI",Roboto,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:16px;color:var(--text)}
.phone{width:min(390px,100%);height:min(820px,calc(100vh - 32px));background:var(--ink);border-radius:34px;border:6px solid #000;overflow:hidden;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
@media (max-width:430px){body{padding:0}.phone{width:100%;height:100%;border-radius:0;border:0}}
/* chamfered frame */
.cut{--k:12px;--c:var(--line);--f:var(--panel);position:relative;background:var(--c);clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));border:0;color:inherit;font:inherit;cursor:pointer}
.cut::before{content:"";position:absolute;inset:2px;background:var(--f);clip-path:polygon(calc(var(--k) - 1px) 0,100% 0,100% calc(100% - var(--k) + 1px),calc(100% - var(--k) + 1px) 100%,0 100%,0 calc(var(--k) - 1px))}
.cut>*{position:relative}
.cut.on{--c:var(--cyan);--f:#0a3b4d}
.cut.hot{--c:var(--pink);--f:#4a1730}
.cut.blue{--c:var(--blue);--f:#1b2f66}
/* status + header */
.status{display:flex;justify-content:space-between;padding:10px 20px 4px;font-weight:700;font-size:15px;color:#fff}
.head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
.brand{font-weight:700;font-size:26px;letter-spacing:.14em;color:var(--cyan)}
.brand b{font-size:12px;letter-spacing:.3em;color:var(--pink);margin-left:6px}
.pill{--k:8px;padding:6px 12px;font-weight:700;font-size:12px;letter-spacing:.1em;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pink)}
.pill.on .dot{background:#3dff9a}
.rule{height:2px;margin:0 18px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}
.scroll{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
/* clock */
.clock{--k:22px;--c:var(--cyan);--f:#0c1430;padding:18px 20px;min-height:128px}
.clock::before{background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);background-size:24px 24px;background-color:#0c1430}
.time{font-size:60px;font-weight:700;color:#fff;letter-spacing:.04em;line-height:1}
.date{font-size:14px;letter-spacing:.18em;color:var(--dim);margin-top:8px}
.next{position:absolute!important;right:18px;bottom:16px;text-align:right;font-size:12px;letter-spacing:.12em;color:var(--amber);font-weight:700}
/* toggles */
.row{display:grid;gap:10px}
.r4{grid-template-columns:repeat(4,1fr)}
.tg{padding:12px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em}
.tg svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tg.on{color:var(--cyan)}
.tg.off{color:var(--dim)}
/* apps */
.app{padding:14px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-align:center}
.app svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* sliders */
.sl{padding:10px 12px 12px;--k:10px}
.sl h4{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;color:var(--dim);margin-bottom:6px}
.sl h4 b{font-size:16px}
.sl input{width:100%;accent-color:var(--cyan);height:22px}
.sl.br input{accent-color:var(--amber)}
.sl.br h4 b{color:var(--amber)}.sl.vo h4 b{color:var(--cyan)}
.two{grid-template-columns:1fr 1fr}
/* dock */
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 18px 12px}
.dock .cut{height:54px;display:grid;place-items:center}
.dock svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));color:#fff}
.nav svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main class="phone">
  <div class="status"><span id="st">9:48</span><span>Wi-Fi ▮▮▮ 75%</span></div>
  <div class="head">
    <div class="brand">DK<b>HOME</b></div>
    <button class="cut pill" id="conn"><span class="dot"></span><span id="connT">CHƯA KẾT NỐI</span></button>
  </div>
  <div class="rule"></div>

  <div class="scroll">
    <div class="cut clock">
      <div class="time" id="time">09:48</div>
      <div class="date" id="date">THỨ SÁU 13/11</div>
      <div class="next">PIN 75%</div>
    </div>

    <div class="row r4">
      <button class="cut tg on" data-t="wifi"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>WI-FI</button>
      <button class="cut tg on" data-t="bt"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>BLUETOOTH</button>
      <button class="cut tg off" data-t="mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>ÂM THANH</button>
      <button class="cut tg off" data-t="torch"><svg viewBox="0 0 24 24"><path d="M9 2h6l-1 6h-4zM10 8v13h4V8"/></svg>ĐÈN PIN</button>
    </div>

    <div class="row r4">
      <button class="cut app blue"><svg viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11H3zM9 20v-7h6v7"/></svg>TRANG CHỦ</button>
      <button class="cut app"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8M12 17v4"/></svg>TV</button>
      <button class="cut app"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 4z"/></svg>TIN NHẮN</button>
      <button class="cut app"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>BÁO THỨC</button>
      <button class="cut app"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>MÁY ẢNH</button>
      <button class="cut app"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>LỊCH</button>
      <button class="cut app"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v11H3z"/></svg>TỆP</button>
      <button class="cut app hot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>CÀI ĐẶT</button>
    </div>

    <div class="row two">
      <div class="cut sl vo"><h4>ÂM LƯỢNG <b id="v1">50</b></h4><input type="range" min="0" max="100" value="50" data-o="v1" aria-label="Âm lượng"></div>
      <div class="cut sl br"><h4>ĐỘ SÁNG <b id="v2">70</b></h4><input type="range" min="0" max="100" value="70" data-o="v2" aria-label="Độ sáng"></div>
    </div>
  </div>

  <div class="dock">
    <button class="cut" aria-label="Điện thoại"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></button>
    <button class="cut" aria-label="Trình duyệt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
    <button class="cut" aria-label="Âm nhạc"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <button class="cut on" aria-label="Micro"><svg viewBox="0 0 24 24" style="stroke:var(--cyan)"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
  <div class="nav">
    <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
    <svg viewBox="0 0 24 24"><path d="M9 6L4 11l5 5M4 11h11a5 5 0 0 1 0 10h-3"/></svg>
  </div>
</main>
<script>
(function(){
  var d=["CHỦ NHẬT","THỨ HAI","THỨ BA","THỨ TƯ","THỨ NĂM","THỨ SÁU","THỨ BẢY"];
  function tick(){
    var n=new Date(),p=function(x){return String(x).padStart(2,"0")};
    var t=p(n.getHours())+":"+p(n.getMinutes());
    document.getElementById("time").textContent=t;
    document.getElementById("st").textContent=t.replace(/^0/,"");
    document.getElementById("date").textContent=d[n.getDay()]+" "+p(n.getDate())+"/"+p(n.getMonth()+1);
  }
  tick();setInterval(tick,15000);
  document.querySelectorAll(".tg").forEach(function(b){
    b.addEventListener("click",function(){b.classList.toggle("on");b.classList.toggle("off");});
  });
  document.querySelectorAll("input[type=range]").forEach(function(r){
    r.addEventListener("input",function(){document.getElementById(r.dataset.o).textContent=r.value;});
  });
  var c=document.getElementById("conn"),ct=document.getElementById("connT");
  c.addEventListener("click",function(){
    var on=c.classList.toggle("on");
    ct.textContent=on?"ĐÃ KẾT NỐI":"CHƯA KẾT NỐI";
  });
})();
</script>
</body>
</html>
