plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dk.home'
    compileSdk 34

    defaultConfig {
        applicationId "com.dk.home"
        minSdk 24
        targetSdk 28
        // Mỗi lần CI build số phiên bản tăng lên (run number), nên APK mới luôn cài đè được bản cũ
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int
        versionCode run + 2
        versionName "1.0.${run + 2}"
    }

    // Cùng một khóa ký cho mọi lần build => cập nhật đè lên bản cũ, không phải gỡ app
    signingConfigs {
        hauos {
            storeFile file('hauos.jks')
            storePassword 'hauos123'
            keyAlias 'hauos'
            keyPassword 'hauos123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.hauos
        }
        release {
            signingConfig signingConfigs.hauos
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Trang Điều khiển: Firebase (tín hiệu) + WebRTC (kênh lệnh), cùng phiên bản với repo cha
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-database-ktx'
    // "Duyệt web" kiểu Webandr (chép từ Mac-Os): WebView mới (WebViewCompat, WebViewAssetLoader), mã hoá mật khẩu đã lưu
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Truyen tep (chep tu truyentep): chup anh bang CameraX, nhap chu, giao dien Material
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'io.github.webrtc-sdk:android:125.6422.06.1'
}
